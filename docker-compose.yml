version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: el_hd_plasticity
    volumes:
      # Mount SSD storage for persistent access
      - /media/mplitt/SSD_storage:/media/mplitt/SSD_storage
      # Optional: mount the workspace for live development
      - .:/app
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
    stdin_open: true
    tty: true
    # Uncomment below if you need port exposure (e.g., for Jupyter)
    ports:
      - "8000:8000"
      - "8888:8888"
