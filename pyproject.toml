[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-name"
version = "0.1.0"
description = "A brief description of the project"
authors = [
    {name = "Author Name", email = "author@example.com"}
]
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "navis",
    "neuprint-python",
    "papermill",
    "nbdime",
    "sessiontools @ git+https://github.com/yfisher-lab/SessionTools.git",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
]

[tools.setuptools.packages.find]
where = ["src"]
