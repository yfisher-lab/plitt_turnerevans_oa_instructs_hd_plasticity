[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "el_hd_plasticity"
version = "0.1.0"
description = "Code to reproduce figures in Plitt & Turner-Evans et al (2025) bioRxiv https://doi.org/10.64898/2025.12.11.693783 "
authors = [
    {name = "Mark Plitt", email = "mark.plitt@berkeley.edu"}
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "seaborn",
    "networkx",
    "scikit-learn",
    "navis",
    "neuprint-python",
    "papermill",
    "nbdime",
    "ipykernel",
    "ipywidgets",
    "pingouin",
    "statsmodels",
    "pillow",
    "imageio[ffmpeg]",
    "sessiontools @ git+https://github.com/yfisher-lab/SessionTools.git",
    "napari[all]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
    "ruff",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# pycodestyle errors (no line-length rule), pyflakes, import sorting, bugbear, pyupgrade,
# simplifications, and sorted __all__
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF022"]
# SIM108 (prefer ternaries) makes several long conditionals harder to read
ignore = ["SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
