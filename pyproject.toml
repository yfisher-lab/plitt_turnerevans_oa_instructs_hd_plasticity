[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "el_hd_plasticity"
version = "0.1.0"
description = "Code to reproduce figures in Plitt & Turner-Evans et al (2025) bioRxiv https://doi.org/10.64898/2025.12.11.693783 "
authors = [
    {name = "Mark Plitt", email = "mark.plitt@berkeley.edu"}
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "navis",
    "neuprint-python",
    "papermill",
    "nbdime",
    "ipykernel",
    "ipywidgets",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
]

[tool.setuptools.packages.find]
where = ["src"]
